name: open-shadow-ai

x-runtime: &runtime
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [backend]
  environment: &environment
    PG_PASSWORD_FILE: /run/secrets/pg_password
    REDIS_PASSWORD_FILE: /run/secrets/redis_password
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "9000"
    CLICKHOUSE_DATABASE: shadai
    CLICKHOUSE_USER: shadai
    CLICKHOUSE_PASSWORD_FILE: /run/secrets/ch_password
    JWT_SECRET_FILE: /run/secrets/jwt_secret
    ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    AGENT_API_KEY_FILE: /run/secrets/agent_api_key
    SHADAI_TENANT_ID: ${SHADAI_TENANT_ID:-default}
    CORS_ORIGINS: ${CORS_ORIGINS:-[]}
  secrets: &app-secrets
    - pg_password
    - redis_password
    - ch_password
    - jwt_secret
    - encryption_key
    - agent_api_key
  volumes:
    - ./config:/app/config:ro
    - ./catalog:/app/catalog:ro

services:
  integration-test:
    <<: *runtime
    profiles: [test]
    restart: "no"
    build: {context: ., dockerfile: docker/Dockerfile.test}
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shadai
      POSTGRES_USER: shadai
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "postgres", "-U", "shadai", "-d", "shadai"]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: shadai
      CLICKHOUSE_USER: shadai
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/ch_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    secrets: [ch_password]
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./docker/clickhouse-init/001_create_database.sql:/docker-entrypoint-initdb.d/001_create_database.sql:ro
      - ./migrations/clickhouse/002_event_metadata.sql:/docker-entrypoint-initdb.d/002_event_metadata.sql:ro
    networks: [backend]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host clickhouse --user shadai --password \"$$(cat /run/secrets/ch_password)\" --query 'SELECT identity_sid FROM shadai.events LIMIT 0'"]
      interval: 10s
      timeout: 5s
      retries: 18

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    secrets: [redis_password]
    volumes: [redis_data:/data]
    networks: [backend]
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass \"$$(cat /run/secrets/redis_password)\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    <<: *runtime
    restart: "no"
    build: {context: ., dockerfile: docker/Dockerfile.api}
    command: [sh, -c, "python -m shadai.cli init-db && python -m shadai.cli sync-catalog"]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *runtime
    build: {context: ., dockerfile: docker/Dockerfile.api}
    ports: ["${SHADAI_BIND_ADDRESS:-127.0.0.1}:${SHADAI_API_PORT:-8443}:8443"]
    networks: [backend, edge]
    depends_on:
      migrate: {condition: service_completed_successfully}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8443/ready',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  ingest-worker:
    <<: *runtime
    build: {context: ., dockerfile: docker/Dockerfile.worker}
    command: [python, -m, shadai.workers.ingest]
    depends_on:
      migrate: {condition: service_completed_successfully}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}

  correlation-worker:
    <<: *runtime
    build: {context: ., dockerfile: docker/Dockerfile.worker}
    command: [python, -m, shadai.workers.correlate]
    depends_on:
      migrate: {condition: service_completed_successfully}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}

  purge-worker:
    <<: *runtime
    build: {context: ., dockerfile: docker/Dockerfile.worker}
    command: [python, -m, shadai.workers.purge]
    depends_on:
      migrate: {condition: service_completed_successfully}
      clickhouse: {condition: service_healthy}

  syslog-collector:
    <<: *runtime
    profiles: [syslog]
    build: {context: ., dockerfile: docker/Dockerfile.collector}
    command: [python, -m, shadai.collectors.syslog_receiver]
    ports: ["${SHADAI_BIND_ADDRESS:-127.0.0.1}:${SHADAI_SYSLOG_PORT:-1514}:1514/tcp"]
    depends_on:
      redis: {condition: service_healthy}

  entra-collector:
    <<: *runtime
    profiles: [entra]
    build: {context: ., dockerfile: docker/Dockerfile.collector}
    command: [python, -m, shadai.collectors.entra]
    networks: [backend, egress]
    environment:
      <<: *environment
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET_FILE: /run/secrets/entra_client_secret
      ENTRA_POLL_INTERVAL_SECONDS: ${ENTRA_POLL_INTERVAL_SECONDS:-300}
      ENTRA_COLLECT_GRANTS: ${ENTRA_COLLECT_GRANTS:-false}
    secrets:
      - pg_password
      - redis_password
      - ch_password
      - jwt_secret
      - encryption_key
      - agent_api_key
      - entra_client_secret
    depends_on:
      redis: {condition: service_healthy}

  frontend:
    build: {context: ./frontend}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["${SHADAI_BIND_ADDRESS:-127.0.0.1}:${SHADAI_UI_PORT:-3000}:8080"]
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  pg_data:
  ch_data:
  redis_data:
secrets:
  pg_password: {file: ./secrets/pg_password.txt}
  redis_password: {file: ./secrets/redis_password.txt}
  ch_password: {file: ./secrets/ch_password.txt}
  jwt_secret: {file: ./secrets/jwt_secret.txt}
  encryption_key: {file: ./secrets/encryption_key.txt}
  agent_api_key: {file: ./secrets/agent_api_key.txt}
  entra_client_secret: {file: ./secrets/entra_client_secret.txt}
networks:
  backend: {internal: true}
  edge:
  egress:
