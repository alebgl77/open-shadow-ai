apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-to-identity-provider
spec:
  podSelector: {matchLabels: {app: open-shadow-ai, component: api}}
  policyTypes: [Egress]
  egress:
    # Documentation-only TEST-NET address. Replace with approved IdP routes.
    # Standard NetworkPolicy cannot express an FQDN allowlist.
    - to: [{ipBlock: {cidr: 198.51.100.0/24}}]
      ports: [{protocol: TCP, port: 443}]
