apiVersion: batch/v1
kind: Job
metadata:
  name: open-shadow-ai-migrate
  namespace: open-shadow-ai
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: open-shadow-ai, component: migrate, tier: backend}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: migrate
          image: open-shadow-ai-api:local
          args: [sh, -c, "python -m shadai.cli init-db && python -m shadai.cli sync-catalog"]
          envFrom:
            - secretRef: {name: open-shadow-ai-runtime}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
