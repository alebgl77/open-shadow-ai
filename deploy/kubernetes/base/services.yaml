apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: open-shadow-ai, component: api}
  ports: [{name: http, port: 8443, targetPort: 8443}]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app: open-shadow-ai, component: frontend}
  ports: [{name: http, port: 8080, targetPort: 8080}]
