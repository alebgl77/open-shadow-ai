apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector: {matchLabels: {app: open-shadow-ai, component: api}}
  template:
    metadata:
      labels: {app: open-shadow-ai, component: api, tier: backend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: open-shadow-ai-api:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8443}]
          envFrom:
            - configMapRef: {name: open-shadow-ai-settings}
            - secretRef: {name: open-shadow-ai-runtime}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: config, mountPath: /app/config, readOnly: true}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}, {name: config, configMap: {name: open-shadow-ai-config}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-worker
spec:
  replicas: 1
  selector: {matchLabels: {app: open-shadow-ai, component: ingest-worker}}
  template:
    metadata:
      labels: {app: open-shadow-ai, component: ingest-worker, tier: backend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ingest-worker
          image: open-shadow-ai-worker:local
          imagePullPolicy: IfNotPresent
          args: [python, -m, shadai.workers.ingest]
          envFrom:
            - configMapRef: {name: open-shadow-ai-settings}
            - secretRef: {name: open-shadow-ai-runtime}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            exec: {command: [python, -m, shadai.workers.probe, startup, --stage, ingest]}
            periodSeconds: 5
            timeoutSeconds: 6
            failureThreshold: 60
          livenessProbe:
            exec: {command: [python, -m, shadai.workers.probe, liveness, --stage, ingest]}
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 3
          readinessProbe:
            exec:
              command: [python, /app/entrypoint.py, python, -m, shadai.workers.probe, readiness, --stage, ingest]
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 3
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: config, mountPath: /app/config, readOnly: true}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}, {name: config, configMap: {name: open-shadow-ai-config}}]
---
