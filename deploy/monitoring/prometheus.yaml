global:
  scrape_interval: 5s
  scrape_timeout: 3s
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: open-shadow-ai
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/shadai_metrics_token
    static_configs:
      - targets: ['api:8443']
