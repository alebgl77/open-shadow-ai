# Deterministic Prometheus engine tests. Most cases isolate one stage/stream;
# inventory cases separately cover all ten expected publications.
rule_files:
  - '../alerts.yaml'
evaluation_interval: '30s'
tests:
  - name: 'authenticated_target_failure_duration_and_recovery'
    interval: '1m'
    input_series:
      - series: 'up{job="open-shadow-ai",instance="api:8443"}'
        values: '0x3 1x16'
      - series: 'shadai_operations_redis_available{job="open-shadow-ai",instance="api:8443"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: '1m'
        alertname: 'ShadaiMetricsTargetDown'
        exp_alerts: []
      - eval_time: '2m'
        alertname: 'ShadaiMetricsTargetDown'
        exp_alerts:
          - exp_labels:
              job: 'open-shadow-ai'
              instance: 'api:8443'
              severity: 'critical'
              owner: 'platform'
            exp_annotations:
              summary: 'Authenticated metrics target unavailable'
              runbook: 'docs/production-monitoring.md'
      - eval_time: '4m'
        alertname: 'ShadaiMetricsTargetDown'
        exp_alerts: []
      - eval_time: '3m'
        alertname: 'ShadaiOperationalSnapshotUnavailable'
        exp_alerts: []
      - eval_time: '3m'
        alertname: 'ShadaiWorkerPublicationMissing'
        exp_alerts: []
  - name: 'missing_expected_target_is_not_other_job_health'
    interval: '1m'
    input_series:
      - series: 'up{job="unrelated",instance="api:8443"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: '1m'
        alertname: 'ShadaiMetricsTargetDown'
        exp_alerts: []
      - eval_time: '2m'
        alertname: 'ShadaiMetricsTargetDown'
        exp_alerts:
          - exp_labels:
              job: 'open-shadow-ai'
              severity: 'critical'
              owner: 'platform'
            exp_annotations:
              summary: 'Authenticated metrics target unavailable'
              runbook: 'docs/production-monitoring.md'
  - name: 'backend_outage_is_unknown_and_suppresses_queue_claims'
    interval: '1m'
    input_series:
      - series: 'up{job="open-shadow-ai",instance="api:8443"}'
        values: '1x20'
      - series: 'shadai_operations_redis_available{job="open-shadow-ai",instance="api:8443"}'
        values: '0x20'
      - series: 'shadai_worker_state_fresh{job="open-shadow-ai",instance="api:8443",stage="ingest",stream="events:dns"}'
        values: '0x20'
      - series: 'shadai_group_present{job="open-shadow-ai",instance="api:8443",stage="ingest",stream="events:dns"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: '2m'
        alertname: 'ShadaiOperationalSnapshotUnavailable'
        exp_alerts:
          - exp_labels:
              job: 'open-shadow-ai'
              instance: 'api:8443'
              severity: 'critical'
              owner: 'platform'
            exp_annotations:
              summary: 'Operational Redis snapshot unavailable or absent'
              runbook: 'docs/production-monitoring.md'
      - eval_time: '3m'
        alertname: 'ShadaiWorkerPublicationMissing'
        exp_alerts: []
      - eval_time: '12m'
        alertname: 'ShadaiBacklogBlocked'
        exp_alerts: []
      - eval_time: '3m'
        alertname: 'ShadaiQueueEvidenceMissing'
        exp_alerts: []
  - name: 'successful_scrape_without_availability_is_not_green'
    interval: '1m'
    input_series:
      - series: 'up{job="open-shadow-ai",instance="api:8443"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: '2m'
        alertname: 'ShadaiOperationalSnapshotUnavailable'
        exp_alerts:
          - exp_labels:
              job: 'open-shadow-ai'
              instance: 'api:8443'
              severity: 'critical'
              owner: 'platform'
            exp_annotations:
              summary: 'Operational Redis snapshot unavailable or absent'
              runbook: 'docs/production-monitoring.md'
      - eval_time: '3m'
        alertname: 'ShadaiWorkerPublicationMissing'
        exp_alerts: []
  - name: 'stale_worker_publication_identifies_stream'
    interval: '1m'
    input_series:
      - series: 'up{job="open-shadow-ai",instance="api:8443"}'
        values: '1x20'
      - series: 'shadai_operations_redis_available{job="open-shadow-ai",instance="api:8443"}'
