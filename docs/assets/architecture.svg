<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">Open Shadow AI architecture</title><desc id="desc">Directory, network, endpoint and instrumented sources flow through ingestion, Redis and the catalog into event and detection stores and an evidence interface. Inventory is distinct from usage.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#879d95"/></marker></defs><rect width="1200" height="790" fill="#f5f6f2"/><text x="48" y="59" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173e37">Open Shadow AI</text><text x="48" y="90" font-family="Arial,sans-serif" font-size="16" fill="#62746c">From source signals to findings you can inspect</text><rect x="928" y="42" width="224" height="32" rx="16" fill="#e3ebe6"/><text x="1040" y="63" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" letter-spacing="1" fill="#173e37">ONE ORGANIZATION / INSTALL</text><path d="M 177 240 V 270 H 177 V 300" fill="none" stroke="#879d95" stroke-width="2" marker-end="url(#arrow)"/><path d="M 459 240 V 270 H 459 V 300" fill="none" stroke="#879d95" stroke-width="2" marker-end="url(#arrow)"/><path d="M 741 240 V 270 H 741 V 300" fill="none" stroke="#879d95" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1023 240 V 270 H 1023 V 300" fill="none" stroke="#879d95" stroke-width="2" marker-end="url(#arrow)"/><path d="M 600 386 V 417 H 177 V 448" fill="none" stroke="#879d95" stroke-width="2" marker-end="url(#arrow)"/><path d="M 306 498 H 330" fill="none" stroke="#879d95" stroke-width="2" marker-end="url(#arrow)"/><path d="M 588 498 H 612" fill="none" stroke="#879d95" stroke-width="2" marker-end="url(#arrow)"/><path d="M 459 548 V 582 H 1023 V 548" fill="none" stroke="#879d95" stroke-width="2" marker-end="url(#arrow)"/><path d="M 741 548 V 579 H 882 V 610" fill="none" stroke="#879d95" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1023 548 V 579 H 882 V 610" fill="none" stroke="#879d95" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="132" width="258" height="108" rx="12" fill="#edf3f0" stroke="#d3dfd7"/><text x="72" y="170" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173e37">AD + Entra</text><text x="72" y="198" font-family="Arial,sans-serif" font-size="14" fill="#62746c">Directory inventory</text></g><g><rect x="330" y="132" width="258" height="108" rx="12" fill="#edf3f0" stroke="#d3dfd7"/><text x="354" y="170" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173e37">DNS + proxy</text><text x="354" y="198" font-family="Arial,sans-serif" font-size="14" fill="#62746c">Network observations</text></g><g><rect x="612" y="132" width="258" height="108" rx="12" fill="#edf3f0" stroke="#d3dfd7"/><text x="636" y="170" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173e37">Managed endpoints</text><text x="636" y="198" font-family="Arial,sans-serif" font-size="14" fill="#62746c">Asset inventory</text></g><g><rect x="894" y="132" width="258" height="108" rx="12" fill="#edf3f0" stroke="#d3dfd7"/><text x="918" y="170" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173e37">Instrumented API</text><text x="918" y="198" font-family="Arial,sans-serif" font-size="14" fill="#62746c">Declared usage evidence</text></g><g><rect x="48" y="300" width="1104" height="86" rx="12" fill="#173e37" stroke="#173e37"/><text x="72" y="338" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff">Scoped collectors + HTTP event API</text><text x="72" y="366" font-family="Arial,sans-serif" font-size="14" fill="#c6ddd4">Trusted-network syslog · API-key-authenticated HTTP</text></g><g><rect x="48" y="448" width="258" height="100" rx="12" fill="#ffffff" stroke="#d3dfd7"/><text x="72" y="486" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173e37">Redis Streams</text><text x="72" y="514" font-family="Arial,sans-serif" font-size="14" fill="#62746c">Queue · retry · dead letters</text></g><g><rect x="330" y="448" width="258" height="100" rx="12" fill="#ffffff" stroke="#d3dfd7"/><text x="354" y="486" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173e37">Catalog + workers</text><text x="354" y="514" font-family="Arial,sans-serif" font-size="14" fill="#62746c">Match · explain · correlate</text></g><g><rect x="612" y="448" width="258" height="100" rx="12" fill="#ffffff" stroke="#d3dfd7"/><text x="636" y="486" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173e37">ClickHouse</text><text x="636" y="514" font-family="Arial,sans-serif" font-size="14" fill="#62746c">Observed events</text></g><g><rect x="894" y="448" width="258" height="100" rx="12" fill="#ffffff" stroke="#d3dfd7"/><text x="918" y="486" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#173e37">PostgreSQL</text><text x="918" y="514" font-family="Arial,sans-serif" font-size="14" fill="#62746c">Detections · governance<tspan x="918" dy="20">Idempotency receipts</tspan></text></g><g><rect x="612" y="610" width="540" height="94" rx="12" fill="#173e37" stroke="#173e37"/><text x="636" y="648" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff">Evidence interface</text><text x="636" y="676" font-family="Arial,sans-serif" font-size="14" fill="#c6ddd4">Sources, confidence, review and explicit unknowns</text></g><text x="48" y="644" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173e37">Inventory ≠ usage</text><text x="48" y="672" font-family="Arial,sans-serif" font-size="14" fill="#62746c">Models and tokens require instrumented evidence.</text><text x="48" y="754" font-family="Arial,sans-serif" font-size="13" fill="#62746c">Self-hosted · No automatic fleet enrollment · Coverage depends on connected sources</text></svg>